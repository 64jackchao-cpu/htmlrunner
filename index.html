<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Runner - Drag & Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        #drop-zone {
            width: 100%;
            height: 200px;
            border: 3px dashed #007bff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #666;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        #drop-zone:hover {
            background-color: #e3f2fd;
            border-color: #0056b3;
        }
        #drop-zone.dragover {
            background-color: #bbdefb;
            border-color: #0056b3;
        }
        #preview {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HTML Runner - Drag & Drop</h1>
        <div id="drop-zone">
            <div style="text-align: center;">
                <p>📁 Drag your HTML file here</p>
                <p style="font-size: 14px; color: #999;">or click to select</p>
            </div>
        </div>
        <iframe id="preview"></iframe>
        <div class="info">
            <p>Upload and run HTML files instantly</p>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const preview = document.getElementById('preview');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.html';
        fileInput.style.display = 'none';

        // Click to upload
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // File selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        // Drag over
        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            event.stopPropagation();
            dropZone.classList.add('dragover');
        });

        // Drag leave
        dropZone.addEventListener('dragleave', (event) => {
            event.preventDefault();
            event.stopPropagation();
            dropZone.classList.remove('dragover');
        });

        // Drop
        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            event.stopPropagation();
            dropZone.classList.remove('dragover');
            const file = event.dataTransfer.files[0];
            handleFile(file);
        });

        function handleFile(file) {
            if (file && file.type === 'text/html') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.srcdoc = e.target.result;
                };
                reader.readAsText(file);
            } else {
                alert('Please select a valid HTML file.');
            }
        }

        document.body.appendChild(fileInput);
    </script>
</body>
</html>
