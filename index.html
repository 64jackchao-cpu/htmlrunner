<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        #drop-area {
            border: 2px dashed #ccc;
            border-radius: 20px;
            width: 100%;
            height: 200px;
            padding: 20px;
            text-align: center;
        }
        #fileElem {
            display: none;
        }
        #uploadBtn {
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="drop-area">
        <p>Drag and drop HTML files here or click to upload.</p>
        <input type="file" id="fileElem" accept="text/html" onchange="handleFiles(this.files)">
        <label for="fileElem" id="uploadBtn">Select HTML File</label>
    </div>
    <iframe id="preview" style="width: 100%; height: 300px; border: 1px solid #ccc; margin-top: 20px;"></iframe>
    <script>
        const dropArea = document.getElementById('drop-area');
        const preview = document.getElementById('preview');

        dropArea.addEventListener('drop', (event) => {
            event.preventDefault();
            const files = event.dataTransfer.files;
            handleFiles(files);
        });

        dropArea.addEventListener('dragover', (event) => {
            event.preventDefault();
        });

        function handleFiles(files) {
            if (files.length) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
